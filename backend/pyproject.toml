[project]
name = "virtualfit-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function call in argument defaults (FastAPI Depends/File)
    "B904", # raise ... from err in HTTP handlers
    "UP042", # StrEnum vs (str, Enum) compatibility
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
